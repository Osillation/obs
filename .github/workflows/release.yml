name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: Osillation/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Generate formula
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BASE="https://github.com/Osillation/obs/releases/download/v${VERSION}"

          # Wait for assets to be fully uploaded
          sleep 15

          curl -fsSL "${BASE}/checksums.txt" -o checksums.txt

          SHA_DARWIN_ARM64=$(awk '/obs_darwin_arm64\.tar\.gz/{print $1}' checksums.txt)
          SHA_DARWIN_AMD64=$(awk '/obs_darwin_amd64\.tar\.gz/{print $1}' checksums.txt)
          SHA_LINUX_ARM64=$(awk '/obs_linux_arm64\.tar\.gz/{print $1}' checksums.txt)
          SHA_LINUX_AMD64=$(awk '/obs_linux_amd64\.tar\.gz/{print $1}' checksums.txt)

          mkdir -p tap/Formula
          python3 - <<PYEOF
import os
v = os.environ.get("VERSION") or "${VERSION}"
base = "${BASE}"
formula = f"""# Generated by release workflow — do not edit manually
class Obs < Formula
  desc "Open-source observability stack CLI (SigNoz + PostHog)"
  homepage "https://github.com/Osillation/obs"
  license "MIT"
  version "{v}"

  on_macos do
    on_arm do
      url "{base}/obs_darwin_arm64.tar.gz"
      sha256 "${SHA_DARWIN_ARM64}"
    end
    on_intel do
      url "{base}/obs_darwin_amd64.tar.gz"
      sha256 "${SHA_DARWIN_AMD64}"
    end
  end

  on_linux do
    on_arm do
      url "{base}/obs_linux_arm64.tar.gz"
      sha256 "${SHA_LINUX_ARM64}"
    end
    on_intel do
      url "{base}/obs_linux_amd64.tar.gz"
      sha256 "${SHA_LINUX_AMD64}"
    end
  end

  def install
    bin.install "obs"
  end

  test do
    system "\#{bin}/obs", "version"
  end
end
"""
with open("tap/Formula/obs.rb", "w") as f:
    f.write(formula)
print("Formula written.")
PYEOF

      - name: Push formula to tap
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/obs.rb
          git commit -m "obs ${VERSION}"
          git push
