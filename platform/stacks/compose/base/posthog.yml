# stacks/compose/base/posthog.yml
# PostHog self-hosted. Based on posthog/docker-compose.hobby.yml
# Ref: https://github.com/PostHog/posthog/blob/main/docker-compose.hobby.yml

name: obs

services:
  posthog-db:
    image: postgres:15-alpine
    container_name: obs-posthog-db
    networks:
      - obs-network
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: posthog
    volumes:
      - posthog-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  posthog-redis:
    image: redis:6.2-alpine
    container_name: obs-posthog-redis
    networks:
      - obs-network
    restart: unless-stopped
    volumes:
      - posthog-redis-data:/data

  posthog-clickhouse:
    image: clickhouse/clickhouse-server:23.6.2.18-alpine
    container_name: obs-posthog-clickhouse
    networks:
      - obs-network
    volumes:
      - posthog-clickhouse-data:/var/lib/clickhouse
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  posthog-kafka:
    image: ghcr.io/posthog/kafka-container:v2.8.2
    container_name: obs-posthog-kafka
    networks:
      - obs-network
    environment:
      KAFKA_BROKER_ID: 1001
      KAFKA_CFG_RESERVED_BROKER_MAX_ID: 1001
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://posthog-kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: obs-zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "true"
    depends_on:
      - zookeeper-1
    restart: unless-stopped

  posthog-web:
    image: posthog/posthog:latest
    container_name: obs-posthog-web
    networks:
      - obs-network
    depends_on:
      - posthog-db
      - posthog-redis
      - posthog-clickhouse
      - posthog-kafka
    environment:
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      REDIS_URL: redis://posthog-redis:6379/
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-insecure-change-me-in-production}
      SITE_URL: https://dashboard.${CLIENT_DOMAIN}/posthog
      DISABLE_SECURE_SSL_REDIRECT: "true"
      IS_BEHIND_PROXY: "true"
      TRUST_ALL_PROXIES: "true"
    restart: unless-stopped
    command: ./bin/docker-server

  posthog-worker:
    image: posthog/posthog:latest
    container_name: obs-posthog-worker
    networks:
      - obs-network
    depends_on:
      - posthog-db
      - posthog-redis
      - posthog-clickhouse
      - posthog-kafka
    environment:
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      REDIS_URL: redis://posthog-redis:6379/
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-insecure-change-me-in-production}
    restart: unless-stopped
    command: ./bin/docker-worker

  posthog-plugins:
    image: posthog/posthog:latest
    container_name: obs-posthog-plugins
    networks:
      - obs-network
    depends_on:
      - posthog-db
      - posthog-redis
      - posthog-clickhouse
      - posthog-kafka
    environment:
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      REDIS_URL: redis://posthog-redis:6379/
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-insecure-change-me-in-production}
    restart: unless-stopped
    command: ./bin/plugin-server

networks:
  obs-network:
    name: obs-network
    driver: bridge

volumes:
  posthog-db-data:
  posthog-redis-data:
  posthog-clickhouse-data:
