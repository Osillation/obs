name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: Osillation/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Build and push formula
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BASE="https://github.com/Osillation/obs/releases/download/v${VERSION}"

          sleep 10

          curl -fsSL "${BASE}/checksums.txt" -o checksums.txt

          SHA_DARWIN_ARM64=$(awk '/obs_darwin_arm64\.tar\.gz/{print $1}' checksums.txt)
          SHA_DARWIN_AMD64=$(awk '/obs_darwin_amd64\.tar\.gz/{print $1}' checksums.txt)
          SHA_LINUX_ARM64=$(awk '/obs_linux_arm64\.tar\.gz/{print $1}' checksums.txt)
          SHA_LINUX_AMD64=$(awk '/obs_linux_amd64\.tar\.gz/{print $1}' checksums.txt)

          mkdir -p tap/Formula

          {
            printf "# Generated by release workflow — do not edit manually\n"
            printf "class Obs < Formula\n"
            printf "  desc \"Open-source observability stack CLI (SigNoz + PostHog)\"\n"
            printf "  homepage \"https://github.com/Osillation/obs\"\n"
            printf "  license \"MIT\"\n"
            printf "  version \"%s\"\n" "$VERSION"
            printf "\n"
            printf "  on_macos do\n"
            printf "    on_arm do\n"
            printf "      url \"%s/obs_darwin_arm64.tar.gz\"\n" "$BASE"
            printf "      sha256 \"%s\"\n" "$SHA_DARWIN_ARM64"
            printf "    end\n"
            printf "    on_intel do\n"
            printf "      url \"%s/obs_darwin_amd64.tar.gz\"\n" "$BASE"
            printf "      sha256 \"%s\"\n" "$SHA_DARWIN_AMD64"
            printf "    end\n"
            printf "  end\n"
            printf "\n"
            printf "  on_linux do\n"
            printf "    on_arm do\n"
            printf "      url \"%s/obs_linux_arm64.tar.gz\"\n" "$BASE"
            printf "      sha256 \"%s\"\n" "$SHA_LINUX_ARM64"
            printf "    end\n"
            printf "    on_intel do\n"
            printf "      url \"%s/obs_linux_amd64.tar.gz\"\n" "$BASE"
            printf "      sha256 \"%s\"\n" "$SHA_LINUX_AMD64"
            printf "    end\n"
            printf "  end\n"
            printf "\n"
            printf "  def install\n"
            printf "    bin.install \"obs\"\n"
            printf "  end\n"
            printf "\n"
            printf "  test do\n"
            printf "    system \"\#{bin}/obs\", \"version\"\n"
            printf "  end\n"
            printf "end\n"
          } > tap/Formula/obs.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/obs.rb
          git commit -m "obs ${VERSION}"
          git push
