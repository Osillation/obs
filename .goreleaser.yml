# .goreleaser.yml
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: obs
    main: ./main.go
    binary: obs
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: obs
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "obs_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: obs
    homepage: https://github.com/osillation/obs
    description: "Open-source observability stack CLI (SigNoz + PostHog)"
    license: MIT
    repository:
      owner: osillation
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "obs"
    test: |
      system "#{bin}/obs", "version"
